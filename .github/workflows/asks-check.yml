# Fails when an ask is in both asks/open and asks/resolved (tools/needs-tim/asks-check.js). Resolve = git mv (asks/README.md).
name: asks-check
on:
  pull_request:
    branches: [main]
    paths: ['asks/**', 'tools/needs-tim/asks-check*', '.github/workflows/asks-check.yml']
  push:
    branches: [main]
    paths: ['asks/**', 'tools/needs-tim/asks-check*', '.github/workflows/asks-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            asks
            tools/needs-tim
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/needs-tim/asks-check.test.js
      - run: node tools/needs-tim/asks-check.js
