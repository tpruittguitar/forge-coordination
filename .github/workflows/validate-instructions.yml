name: Validate instruction release
on:
  pull_request:
    paths: ["policy/**", "runtime/**", "scripts/**", "schemas/**", "examples/**", "tests/**", "control/**", "lanes/**", "tools/alert-preparse/**", "tools/email-recovery/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["policy/**", "runtime/**", "scripts/**", "schemas/**", "examples/**", "tests/**", "control/**", "lanes/**", "tools/alert-preparse/**", "tools/email-recovery/**", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_alert_preparse.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/automation-run-lock.test.cjs
      - run: node --test tools/email-recovery/*.test.cjs
      - run: python scripts/build_runtime.py --check
