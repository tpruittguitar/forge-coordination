name: Validate instruction release
on:
  pull_request:
    paths: ["policy/**", "runtime/**", "scripts/**", "schemas/**", "examples/**", "tests/**", "control/**", "lanes/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["policy/**", "runtime/**", "scripts/**", "schemas/**", "examples/**", "tests/**", "control/**", "lanes/**", ".github/workflows/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_runtime.py --check
