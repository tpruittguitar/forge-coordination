name: source-intake-preview-test
on:
  pull_request:
    paths:
      - 'tools/source-intake/**'
      - 'tools/source-trial/lib.js'
      - '.github/workflows/source-intake-preview-test.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source-intake preview
        run: node --test tools/source-intake/preview.test.js
