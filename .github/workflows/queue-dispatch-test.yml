# Unit tests for queue-driven Forge step 1 (self/next dispatch decision).
name: queue-dispatch-test
on:
  pull_request:
    paths:
      - 'tools/queue-dispatch/**'
      - '.github/workflows/source-intake-auto.yml'
      - '.github/workflows/enrich-ats-pay.yml'
      - '.github/workflows/queue-dispatch-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/queue-dispatch/*.test.js
