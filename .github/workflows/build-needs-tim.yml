# Rebuilds attention/NEEDS_TIM.json for the Pipeline Explorer "Needs you" page (Tim 2026-10-18 15:41 ET).
# Runs on every push that is not its own output, every 30 minutes (lane silence and unfinished runs depend on time),
# and on demand. Commits only when the list actually changed.
name: build-needs-tim
on:
  push:
    branches: [main]
    # REV-137: bot-only outputs (receipt index hints, ATS pay report) never change the list; skip the rerun they caused.
    paths-ignore: ['attention/**', 'state/latest.json', 'state/enrich-ats-pay*.json', 'state/source-trial-report.*']
  schedule:
    - cron: '6,36 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-needs-tim
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test builder
        run: node --test tools/needs-tim/build.test.js
      - name: Fetch open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '[]' > /tmp/prs.json
          for r in foreman-cockpit forge-policy forge-coordination forge-writer-state; do
            gh api "repos/tpruittguitar/$r/pulls?state=open&per_page=50" \
              --jq "[.[] | {repo: \"$r\", number, title, draft, created_at, url: .html_url}]" > /tmp/pr_$r.json || echo '[]' > /tmp/pr_$r.json
          done
          jq -s 'add' /tmp/pr_*.json > /tmp/prs.json
      - name: Build
        run: node tools/needs-tim/build.js --prs /tmp/prs.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- attention/ && [ -z "$(git ls-files --others --exclude-standard attention/)" ]; then
            echo "No change"; exit 0
          fi
          git config user.name forge-needs-tim-bot
          git config user.email forge-needs-tim-bot@users.noreply.github.com
          # Other lanes and bots push to main in bursts (run #367, 2026-10-20 13:11 UTC, lost every retry during a ChatGPT
          # commit burst). The list is derived from main, so each retry starts from the latest main and rebuilds it:
          # no rebase can be left half done, and an unchanged list ends the step quietly.
          for i in 1 2 3 4 5 6; do
            git add attention/NEEDS_TIM.json
            git diff --cached --quiet -- attention/ && { echo "No change after refresh"; exit 0; }
            git commit -q -m "NEEDS-TIM-BOT: rebuild attention list"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4 + RANDOM % 4))
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            node tools/needs-tim/build.js --prs /tmp/prs.json
          done
          exit 1
