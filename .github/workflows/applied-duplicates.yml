name: applied-duplicates
# Tim 2026-11-03 ("solve it and forget it"): jobs waiting on Tim that repeat a role he already applied to, was rejected
# from, or declined. Same posting -> Writer DUPLICATE of the decided row. Anything else stays active with a
# PRIOR_APPLICATION label shown in the Explorer. No question is ever queued for Tim. Report: state/APPLIED_DUPLICATES_REPORT.md
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
concurrency:
  group: applied-duplicates
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tpruittguitar/foreman-cockpit
          path: _fc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/applied-duplicates/*.test.js
      - name: Apply and publish report
        env:
          APPLIED_DUP_FC_DIR: _fc
        run: |
          set -euo pipefail
          git config user.name forge-duplicates-bot
          git config user.email forge-duplicates-bot@users.noreply.github.com
          node tools/applied-duplicates/run.js
          cp state/APPLIED_DUPLICATES_REPORT.json state/APPLIED_DUPLICATES_REPORT.md "$RUNNER_TEMP/"
          for attempt in 1 2 3 4; do
            cp "$RUNNER_TEMP/APPLIED_DUPLICATES_REPORT.json" "$RUNNER_TEMP/APPLIED_DUPLICATES_REPORT.md" state/
            git add state/APPLIED_DUPLICATES_REPORT.json state/APPLIED_DUPLICATES_REPORT.md
            git diff --cached --quiet && exit 0
            git commit -m "DUPLICATES-BOT: applied-duplicate report"
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
