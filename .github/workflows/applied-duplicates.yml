name: applied-duplicates
# Tim 2026-11-03: dry-run report of jobs waiting on Tim that repeat a role he already applied to, was rejected from,
# or declined. Reads the canonical master read-only and publishes state/APPLIED_DUPLICATES_REPORT.{json,md}.
# It never submits to the Writer or changes a row; automatic closing needs Tim's separate approval.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 */3 * * *'
permissions:
  contents: write
concurrency:
  group: applied-duplicates
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tpruittguitar/foreman-cockpit
          path: _fc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/applied-duplicates/*.test.js
      - name: Publish dry-run report
        env:
          APPLIED_DUP_FC_DIR: _fc
        run: |
          set -euo pipefail
          git config user.name forge-duplicates-bot
          git config user.email forge-duplicates-bot@users.noreply.github.com
          for attempt in 1 2 3 4; do
            node tools/applied-duplicates/run.js
            git add state/APPLIED_DUPLICATES_REPORT.json state/APPLIED_DUPLICATES_REPORT.md
            git diff --cached --quiet && exit 0
            git commit -m "DUPLICATES-BOT: applied-duplicate dry-run report"
            git push origin HEAD:main && exit 0
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
