name: Publish compact Writer activity
# Re-register schedule and workflow_run delivery (card 24b2d97, 2026-11-18).
# GitHub stopped creating those runs after 2026-11-18T13:16:10Z; the cron expression is unchanged.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [enrich-ats-pay, source-trial, board-discovery, source-intake-auto, writer-verify, receipt-recovery]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths: ['receipts/**', 'verify/recovery/**', 'tools/pipeline-observability/**', '.github/workflows/pipeline-observability.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: pipeline-observability
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: tpruittguitar/foreman-cockpit
          path: _fc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/pipeline-observability/*.test.js tools/manual-backlog/*.test.cjs tools/upstream-ledger/*.test.cjs
        env:
          ACTIVITY_FC_DIR: _fc
      - name: Check for a missed discovery start
        continue-on-error: true # a dispatch/API failure must not stop publication of measured job counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(node tools/pipeline-observability/discovery-watchdog.js); echo "$out"
          case "$out" in *board-discovery.yml*) export BOARD_DISCOVERY_DISPATCHED=1;; esac
          node tools/pipeline-observability/enrichment-watchdog.js
      - name: Publish cheap Writer activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY_FC_DIR: _fc
        run: |
          set -euo pipefail
          git config user.name forge-activity-bot
          git config user.email forge-activity-bot@users.noreply.github.com
          for attempt in 1 2 3 4; do
            node tools/pipeline-observability/publish-report.js activity
            node tools/pipeline-observability/git-publish.js --message "ACTIVITY-BOT: publish compact verified receipt activity" state/WRITER_ACTIVITY.json state/WRITER_ACTIVITY_DETAILS.json state/REPORTING_HEALTH.json && exit 0
            sleep $((attempt * 2 + RANDOM % 3))
            git fetch origin main
            # Reuse the completed report when other bots changed unrelated paths.
            # Conflicting policy/queue changes require a rebuild, never choosing a side.
            if git -c core.editor=true rebase origin/main; then
              node tools/pipeline-observability/git-publish.js --message "ACTIVITY-BOT: publish compact verified receipt activity" state/WRITER_ACTIVITY.json state/WRITER_ACTIVITY_DETAILS.json state/REPORTING_HEALTH.json && exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
          done
          exit 1
      - name: Publish flow with incremental cursor
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY_FC_DIR: _fc
          UPSTREAM_FLOW_COMMIT_CURSOR: '1'
        run: |
          set -euo pipefail
          git config user.name forge-activity-bot
          git config user.email forge-activity-bot@users.noreply.github.com
          for attempt in 1 2 3 4; do
            # Every build, including the first, starts at canonical main. A rejected
            # cursor or a real flow input change must rebuild; only proven status-only drift may retarget.
            # A fixed time window cannot guarantee overlap with the saved discovery
            # history. Fetch ancestry without downloading unrelated historical blobs.
            if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
              git fetch --no-tags --unshallow --filter=blob:none origin main
            else
              git fetch --no-tags origin main
            fi
            git reset --hard FETCH_HEAD
            if node tools/pipeline-observability/publish-report.js flow intake-queue &&
               node tools/pipeline-observability/git-publish.js --allow-status-only-reparent --message "ACTIVITY-BOT: publish compact verified receipt activity" receipts/manual-backlog state/REPORTING_HEALTH.json state/PROCESS_COMPLETIONS.json state/ENRICHMENT_OUTCOMES.json state/RELEVANCE_SCREEN_GUARD.json state/ENRICHMENT_FLOW.json state/UPSTREAM_LEDGER.json state/upstream-ledger-archive state/UPSTREAM_FLOW.json state/PIPELINE_WAITING_QUEUES.json state/waiting-queues state/discovery-evidence state/DISCOVERY_SCREEN_REPORT.json state/INTAKE_DRAIN.json state/intake-drain-archive state/UPSTREAM_COLLECT_CURSOR.json; then
              exit 0
            fi
            sleep $((attempt * 2 + RANDOM % 3))
          done
          exit 1
      - name: Retain reporting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-evidence
          path: |
            state/REPORTING_HEALTH.json
            state/WRITER_ACTIVITY.json
            state/ENRICHMENT_FLOW.json
          if-no-files-found: ignore
