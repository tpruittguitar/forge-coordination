# Applies edit requests that AI lanes CREATE (create-only lanes can still change existing files).
# A request is a new JSON file in edit-requests/:
#   {"target": "ACCESS_LOG.md", "mode": "append" | "replace", "content": "...", "base_blob_sha": "<optional; reject if target changed>", "requested_by": "CHATGPT <run id>"}
# The Action validates it, applies it, records the result in edit-requests/applied/ or edit-requests/rejected/, and commits.
name: apply-edit-requests
on:
  push:
    paths: ["edit-requests/*.json"]
permissions:
  contents: write
  issues: write
concurrency:
  group: apply-edit-requests
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "forge-apply-bot"
          git config user.email "forge-apply-bot@users.noreply.github.com"
          mkdir -p edit-requests/applied edit-requests/rejected
          shopt -s nullglob
          for f in edit-requests/*.json; do
            name=$(basename "$f")
            verdict=$(python3 - "$f" <<'PY'
          import json, os, subprocess, sys
          f = sys.argv[1]
          try:
              r = json.load(open(f, encoding="utf-8"))
          except Exception as e:
              print(f"REJECT bad JSON: {e}"); sys.exit()
          t, mode, content = r.get("target"), r.get("mode"), r.get("content")
          if not (isinstance(t, str) and isinstance(content, str) and mode in ("append", "replace") and r.get("requested_by")):
              print("REJECT missing or invalid target/mode/content/requested_by"); sys.exit()
          p = os.path.normpath(t).replace('\\', '/')
          # Authoritative instructions/generated state and immutable evidence use
          # direct reviewed changes, never a self-declared requested_by string.
          if p.startswith("..") or os.path.isabs(p) or (p != "control/SUGGESTIONS.txt" and p.split('/')[0] not in ("proposals", "usage")):
              print(f"REJECT target not allowed: {t}"); sys.exit()
          root = os.path.realpath(".")
          resolved = os.path.realpath(p)
          if os.path.commonpath([root, resolved]) != root or os.path.islink(p):
              print(f"REJECT target escapes checkout: {t}"); sys.exit()
          # Suggestions are append-only and must carry a single unapproved entry.
          if p == "control/SUGGESTIONS.txt":
              keys = ["ID","DATE","BY","COMPONENT","SEVERITY","EVIDENCE","PROBLEM","PROPOSED_FIX","SUGGESTED_BUILDER","STATUS","TIM_DECISION"]
              lines = [line for line in content.splitlines() if line.strip()]
              pairs = [line.split("=",1) for line in lines]
              if (mode != "append" or len(pairs) != len(keys) or
                  any(len(pair) != 2 or pair[0] != key for pair,key in zip(pairs,keys)) or
                  not __import__("re").fullmatch(r"SUG-\d{8}-(?:CHATGPT|CLAUDE|GROK)-\d{2,}",pairs[0][1]) or
                  pairs[4][1] not in ("CRITICAL","HIGH","MEDIUM","LOW") or
                  pairs[9][1] != "OPEN" or pairs[10][1].strip() or
                  pairs[8][1] not in ("CHATGPT","CLAUDE","GROK","UNASSIGNED")):
                  print("REJECT invalid suggestion entry (must be append-only, OPEN, undecided)"); sys.exit()
              previous = open(p,encoding="utf-8").read() if os.path.exists(p) else ""
              if "ID=" + pairs[0][1] + "\n" in previous:
                  print("REJECT duplicate suggestion ID"); sys.exit()
          base = r.get("base_blob_sha")
          if os.path.exists(p) and not base:
              print("REJECT existing target requires base_blob_sha"); sys.exit()
          if base:
              cur = subprocess.run(["git", "rev-parse", f"HEAD:{p}"], capture_output=True, text=True).stdout.strip()
              if cur != base:
                  print(f"REJECT stale base_blob_sha (current {cur or 'missing'})"); sys.exit()
          if mode == "append":
              old = open(p, encoding="utf-8").read() if os.path.exists(p) else ""
              if old and not old.endswith("\n"):
                  old += "\n"
              new = old + content
          else:
              new = content
          os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
          open(p, "w", encoding="utf-8").write(new)
          print(f"APPLIED {mode} to {p}")
          PY
            )
            echo "$name: $verdict"
            if [[ "$verdict" == APPLIED* ]]; then dest=edit-requests/applied; else dest=edit-requests/rejected; fi
            git mv "$f" "$dest/$name"
            printf '%s\n' "$verdict" > "$dest/${name%.json}.result.txt"
            git add -A
            git commit -q -m "APPLY-BOT $name: $verdict"
            if [[ "$verdict" == REJECT* ]]; then
              gh issue create --title "Edit request rejected: $name" --body "$verdict" || true
            fi
          done
          git push
