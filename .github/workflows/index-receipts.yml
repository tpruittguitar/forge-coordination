name: Index receipt discovery hints
on:
  push:
    branches: [main]
    paths: ["receipts/**", "scripts/index_receipts.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index-receipts
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and publish current hints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name forge-index-bot
          git config user.email forge-index-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/index_receipts.py
            git add state/latest.json
            if git diff --cached --quiet; then exit 0; fi
            # REV-137: a change that is only the source_commit stamp is not new information (26 of 81 commits on 2026-10-20/21)
            if ! git diff --cached -U0 | grep '^[-+]' | grep -v '^[-+][-+]' | grep -qv '"source_commit"'; then echo "Only the source_commit stamp changed"; exit 0; fi
            git commit -m "INDEX-BOT RECEIPT-HINTS: refresh immutable receipt pointers"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Receipt hints not published after concurrent pushes; workers use scoped listing.' >&2
          exit 1
