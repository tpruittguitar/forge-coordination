name: enrich-ats-pay-test
on:
  pull_request:
    paths: ['tools/enrich-ats-pay/**', 'tools/source-trial/**', 'tools/email-recovery/**', 'tools/routine-handoffs/alert-recovery*', 'tools/pipeline-observability/**', '.github/workflows/enrich-ats-pay*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tpruittguitar/foreman-cockpit
          path: _fc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/relevance-screen/writer-identity.test.cjs tools/enrich-ats-pay/*.test.js tools/source-trial/*.test.js tools/email-recovery/*.test.cjs tools/routine-handoffs/alert-recovery*.test.cjs tools/pipeline-observability/upstream-flow.test.js tools/pipeline-observability/waiting-queues.test.js
        env:
          ENRICH_FC_DIR: ${{ github.workspace }}/_fc
