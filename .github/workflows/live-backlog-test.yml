name: Live backlog worksheet tests
on:
  pull_request:
    paths: ["tools/live-backlog/**", "tools/pipeline-observability/waiting-queues.js", ".github/workflows/live-backlog-test.yml"]
  push:
    branches: [main]
    paths: ["tools/live-backlog/**", "tools/pipeline-observability/waiting-queues.js", ".github/workflows/live-backlog-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/live-backlog/model.test.cjs tools/live-backlog/server.test.cjs tools/live-backlog/occurrences.test.cjs tools/live-backlog/match-evidence.test.cjs tools/live-backlog/ats-hits.test.cjs
