name: programmed-coordinator-test
on:
  pull_request:
  push:
    paths:
      - 'tools/programmed-coordinator/**'
      - 'tools/routine-handoffs/**'
      - 'tools/email-recovery/**'
      - 'tools/relevance-screen/**'
      - 'tools/helper-routing/**'
      - '.github/workflows/programmed-coordinator-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix tools/routine-handoffs --ignore-scripts
      - run: npx --prefix tools/routine-handoffs playwright install --with-deps chromium
      - run: node --test tools/routine-handoffs/*.test.cjs tools/programmed-coordinator/*.test.cjs tools/relevance-screen/*.test.cjs tools/helper-routing/*.test.cjs tools/email-recovery/*.test.cjs tests/automation-run-lock.test.cjs
