# REV-116 (Tim 2026-10-20 18:09-18:21 ET): pay and degree enrichment off the Writer. Reads jobs from the Cloudflare structured
# copy, takes pay from the posting first (employer ATS, then LinkedIn / Indeed / ZipRecruiter postings), estimates from
# employer-posted comparables only after the posting was read, and hands the Writer at most 2 batches of 25 rows per run.
# tools/enrich-ats-pay/config.json "submit": false = dry run (report only, Writer untouched).
name: enrich-ats-pay
on:
  schedule:
    - cron: '12,27,42,57 * * * *'   # Tim: every 15 minutes; existing concurrency lock serializes runs
  workflow_dispatch:
    inputs:
      products_only:
        description: Copy confirmed site products without repeating pay or degree research
        type: boolean
        required: false
        default: false
      reason:
        description: 'Why this run was dispatched: self, next, or safety-clock'
        required: false
        type: string
      parent_run_id:
        description: GitHub run id that dispatched this run
        required: false
        type: string
      depth:
        description: 'Dispatch chain depth; stop at 6'
        required: false
        type: string
        default: '0'
      grant_smoke:
        description: 'cs-4c70ac05: one-row $0.01 grant extraction smoke (FORGE_ATS_GRANT_KEY); never on schedule or chained runs'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
  actions: write   # queue-driven self/next dispatch
concurrency:
  group: enrich-ats-pay
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tpruittguitar/foreman-cockpit
          path: _fc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Note queue-dispatch start
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/queue-dispatch-start"
      - name: Test
        env:
          ENRICH_FC_DIR: ${{ github.workspace }}/_fc
        # Tests write synthetic reports. Keep every test output outside the
        # runtime checkout, including when tests or enrichment fail.
        run: bash tools/enrich-ats-pay/test-isolated.sh
      - name: Enrich
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENRICH_FC_DIR: ${{ github.workspace }}/_fc
          ENRICH_PRODUCTS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.products_only && '1' || '' }}
          # Grant mode only on an explicit dispatch; scheduled and queue-chained runs stay the normal producer.
          FORGE_ATS_GRANT_ACTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.grant_smoke && '1' || '' }}
          FORGE_ATS_GRANT_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.grant_smoke && secrets.FORGE_ATS_GRANT_KEY || '' }}
          FORGE_ATS_GRANT_ORG_ID: ${{ vars.FORGE_ATS_GRANT_ORG_ID }}
          FORGE_ATS_GRANT_PROJECT_ID: ${{ vars.FORGE_ATS_GRANT_PROJECT_ID }}
          FORGE_ATS_GRANT_MAX_ROWS: '1'
        run: node tools/enrich-ats-pay/run.js
      - name: Preserve report and pending-write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pay-runtime-${{ github.run_id }}
          path: |
            state/enrich-ats-pay*.json
            state/enrich-ats-pay-employer.parts/**
            receipts/FORGE-ENRICH_ATS-ATSBOT-*_NOT_ACCEPTED.json
          retention-days: 14
      - name: Commit report and ledger
        if: always()
        run: |
          mkdir -p /tmp/out && cp state/enrich-ats-pay*.json /tmp/out/
          if [ -d state/enrich-ats-pay-employer.parts ]; then cp -a state/enrich-ats-pay-employer.parts /tmp/out/; fi
          mkdir -p /tmp/pay-refusals
          find receipts -maxdepth 1 -type f -name 'FORGE-ENRICH_ATS-ATSBOT-*_NOT_ACCEPTED.json' -exec cp -- {} /tmp/pay-refusals/ \;
          cp reference/COMPANY_SITE_CONTEXT.json /tmp/salary-context.json
          cp reference/EMPLOYER_PAY_SOURCES.json /tmp/pay-source-profile.json
          cp reference/EMPLOYER_PAY_BENCHMARKS.json /tmp/pay-benchmarks.json
          git config user.name forge-ats-pay-bot
          git config user.email forge-ats-pay-bot@users.noreply.github.com
          # Same retry shape as build-needs-tim (REV-104): each retry starts from the latest main and re-copies only these files.
          for i in 1 2 3 4 5 6; do
            # Restore immutable refusal proofs alongside the ledger on EVERY
            # retry; never overwrite another publisher's different proof.
            for proof in /tmp/pay-refusals/*.json; do
              [ -f "$proof" ] || continue
              dest="receipts/$(basename "$proof")"
              if [ -f "$dest" ] && ! cmp -s "$proof" "$dest"; then
                echo "Immutable refusal proof conflict: $dest" >&2
                exit 1
              fi
              cp -n -- "$proof" "$dest"
            done
            node tools/enrich-ats-pay/merge-context.cjs /tmp/salary-context.json
            node tools/enrich-ats-pay/merge-source-profile.cjs /tmp/pay-source-profile.json
            node tools/enrich-ats-pay/merge-benchmarks.cjs /tmp/pay-benchmarks.json
            if [ -d state/enrich-ats-pay-employer.parts ]; then git add state/enrich-ats-pay-employer.parts; fi
            git add state/enrich-ats-pay*.json reference/COMPANY_SITE_CONTEXT.json reference/EMPLOYER_PAY_SOURCES.json reference/EMPLOYER_PAY_BENCHMARKS.json
            find receipts -maxdepth 1 -type f -name 'FORGE-ENRICH_ATS-ATSBOT-*_NOT_ACCEPTED.json' -print0 | xargs -0 -r git add --
            # Verify the staged Git bytes, not only the pre-normalization files.
            node tools/enrich-ats-pay/verify-cache-index.cjs
            git diff --cached --quiet && { echo "No change"; exit 0; }
            git commit -q -m "ATS-PAY-BOT: enrichment report"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 4 + RANDOM % 4))
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp -a /tmp/out/. state/
          done
          exit 1
      - name: Queue next enrich run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_LANE: enrich-ats-pay
          QUEUE_DEPTH: ${{ github.event.inputs.depth || 0 }}
          QUEUE_RUN_ID: ${{ github.run_id }}
          QUEUE_START_FILE: ${{ runner.temp }}/queue-dispatch-start
        run: node tools/queue-dispatch/run.js
