# AUTO source intake (Tim 2026-10-23): after each source trial on main, insert up to maxBatch filtered NEW roles through the
# Writer with the stage's executor gates. Also after board-discovery, using that report. Off unless
# control/SOURCE_INTAKE_RELEASE.json is armed as AUTO and the FORGE_WRITER_KEY secret exists. A failed run means THAT run
# halted. Later runs reconcile captured completed writes read-only and carry untouched work forward. If proof is still
# missing, the run fails visibly without replay; the latch remains a BLOCKING item on attention/NEEDS_TIM.json.
# See tools/source-intake/auto-run.js.
name: source-intake-auto
on:
  workflow_run:
    workflows: [source-trial, board-discovery]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: source-intake-auto
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 25 inserts at ~6 min each waiting for durable receipts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate returned role research independently
        run: node tools/intake-drain/queue.cjs verify "$RUNNER_TEMP/intake-drain-sources"
      # Publish recovered bookkeeping before beginning another potentially long intake batch.
      - name: Reconcile earlier runs
        env:
          FORGE_WRITER_KEY: ${{ secrets.FORGE_WRITER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/source-intake/auto-run.js --recover-only
      - name: Publish earlier-run recovery
        if: always()
        run: bash tools/source-intake/publish-run-records.sh
      - name: Intake
        env:
          FORGE_WRITER_KEY: ${{ secrets.FORGE_WRITER_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          INTAKE_REPORT: ${{ github.event.workflow_run.name == 'board-discovery' && 'state/board-discovery-report.json' || 'state/source-trial-report.json' }}
        run: node tools/source-intake/auto-run.js --skip-recovery --catch-up --report "$INTAKE_REPORT"
      # The run record holds every Writer response (the recovery evidence after a halt), so it is kept twice.
      - name: Keep the run record as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-intake-record
          path: |
            receipts/auto-intake/
            state/INTAKE_DRAIN.json
          if-no-files-found: ignore
      # Same retry shape as the source trial: on a rejected push start from the latest main and copy the record back
      # (the 2026-10-23 17:34 run lost its record because a rebase in this shallow checkout failed).
      - name: Commit run record (also after a halt)
        if: always()
        run: bash tools/source-intake/publish-run-records.sh
