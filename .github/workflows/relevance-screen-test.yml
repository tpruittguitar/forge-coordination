name: relevance-screen-test
on:
  pull_request:
  push:
    paths:
      - 'tools/relevance-screen/**'
      - 'control/RELEVANCE_SCREEN.json'
      - '.github/workflows/relevance-screen-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/relevance-screen/*.test.cjs
